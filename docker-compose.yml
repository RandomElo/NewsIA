# Postgres et LiteLLM sont des ressources partagées, définies dans ../commun/docker-compose.yml.
# Les démarrer avant ce projet : cd ../commun && docker compose up -d
# Ici, les services les joignent via le réseau externe "commun" (hosts : postgres, litellm).

services:

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: news-api
    env_file: .env
    ports:
      - "8100:8100"
    networks:
      - default
      - commun
    restart: unless-stopped
    mem_limit: 250m

  traitements:
    build:
      context: .
      dockerfile: traitements/Dockerfile
    container_name: news-traitements
    env_file:
      - .env
      # Webhook Discord partagé avec le redémarrage hebdo du Pi (alerte si le traitement échoue)
      - path: ../commun/scripts/.env.discord
        required: false
    networks:
      - default
      - commun
    restart: unless-stopped
    # Pas de volume sur storage/browser-profile : le profil Chromium ne doit
    # persister que pendant la vie du conteneur, pas au-delà (cf. demande).
    shm_size: "512mb"   # Chromium a besoin de plus de /dev/shm que le défaut Docker
    # 700m ne suffisait pas : traitement de 23h50 tué par l'OOM killer les 07/10 et 08/10
    # pendant les téléchargements Playwright. Chromium est maintenant limité à 1 instance
    # (rss.py), cette limite garde de la marge pour le pic.
    mem_limit: 1g

networks:
  commun:
    external: true
